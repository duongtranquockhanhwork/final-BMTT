services:
  securechat:
    build: .
    image: securechat-demo
    container_name: securechat
    ports:
      - "8070:8070"
    environment:
      # Fixed admin passcode (change it to whatever you want for the class)
      - SC_ADMIN_PASSCODE=123456
      # IMPORTANT: set this to YOUR laptop's Wi-Fi IP so phones can reach the join
      # URL and QR code. Find it with:  ipconfig getifaddr en0   (macOS)
      #                                 hostname -I              (Linux)
      - SC_PUBLIC_HOST=192.168.1.15
    restart: unless-stopped
