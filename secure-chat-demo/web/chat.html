<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecureChat</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="banner">🎓 Demo giáo dục · tin nhắn được ký số · dữ liệu sẽ bị xóa sau buổi demo</div>
  <div class="bar">
    <span class="me"><span class="avatar sm" id="meAv"></span><span id="meName"></span></span>
    <span class="pill good hide-sm">🔑 Đã có cặp khóa ECDSA</span>
    <span class="grow"></span>
    <span class="conn" id="conn" title="Kết nối"></span>
    <button class="btn sm ghost" onclick="leave()">Thoát</button>
  </div>
  <div class="chat">
    <div class="contacts" id="contacts"></div>
    <div class="thread">
      <div class="thread-head" id="threadHead"></div>
      <div class="msgs" id="msgs"></div>
      <form class="compose" id="composeForm" autocomplete="off">
        <input id="text" placeholder="Nhập tin nhắn..." maxlength="500" autocomplete="off" enterkeyhint="send" disabled>
        <button class="btn sm" id="sendBtn" type="submit" disabled>Gửi</button>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/student.js"></script>
<script>
// automation helper for screenshots/bookmarks (localhost): #t=<token>&verify[&peer=<uid>]
const _ht = location.hash.match(/t=([a-f0-9]+)/);
if (_ht) localStorage.setItem('sc_token', _ht[1]);
const AUTOVERIFY = /(^|[#&])verify/.test(location.hash);
const _hpeer = location.hash.match(/peer=(\d+)/);
const TOKEN = localStorage.getItem('sc_token');
if (!TOKEN) location.replace('/');

let ME = null, peer = _hpeer ? +_hpeer[1] : null, lastEvent = -1, contacts = [], messages = [];
let known = null;        // ids of messages seen at least once (to detect NEW incoming ones)
let sending = false, polling = false;

/* per-account memory: last message read per conversation + verified results */
const seenKey = 'sc_seen_' + TOKEN, verKey = 'sc_ver_' + TOKEN;
const seen = JSON.parse(localStorage.getItem(seenKey) || '{}');
const verified = new Set(JSON.parse(sessionStorage.getItem(verKey) || '[]'));
function saveSeen() { localStorage.setItem(seenKey, JSON.stringify(seen)); }

function contactName(uid) { const c = contacts.find(x => x.uid === uid); return c ? c.name : '?'; }
function unreadCount(uid) { return messages.filter(m => !m.mine && m.peer === uid && m.id > (seen[uid] || 0)).length; }
function lastOf(uid) { let l = null; for (const m of messages) if (m.peer === uid) l = m; return l; }

function render() {
  if (!ME) return;
  const meAv = document.getElementById('meAv');
  meAv.textContent = initials(ME.name); meAv.style.background = ME.color;
  document.getElementById('meName').textContent = ME.name;

  // mark the open conversation as read
  if (peer !== null && !document.hidden) {
    const ids = messages.filter(m => m.peer === peer && !m.mine).map(m => m.id);
    if (ids.length && Math.max(...ids) > (seen[peer] || 0)) { seen[peer] = Math.max(...ids); saveSeen(); }
  }

  // contacts: most recent conversation first, unread badge, last-message preview
  const list = contacts.slice().sort((a, b) => ((lastOf(b.uid) || {}).ts || 0) - ((lastOf(a.uid) || {}).ts || 0) || a.name.localeCompare(b.name));
  const cbox = document.getElementById('contacts');
  cbox.innerHTML = list.length ? list.map(c => {
    const u = unreadCount(c.uid), l = lastOf(c.uid);
    const prev = l ? (l.mine ? 'Bạn: ' : '') + l.text : 'Chưa có tin nhắn';
    return `<div class="contact ${peer === c.uid ? 'active' : ''}" onclick="pick(${c.uid})">
      <span class="avatar sm" style="background:${c.color}">${esc(initials(c.name))}</span>
      <div class="c-main"><b>${esc(c.name)}</b><small class="${u ? 'strong' : ''}">${esc(prev)}</small></div>
      ${u ? `<span class="badge">${u}</span>` : ''}</div>`;
  }).join('') : '<div class="empty" style="padding:22px">Chưa có ai khác tham gia.<br>Mời bạn bè quét mã QR!</div>';

  const total = contacts.reduce((n, c) => n + unreadCount(c.uid), 0);
  document.title = (total ? `(${total}) ` : '') + 'SecureChat';
  document.getElementById('app').classList.toggle('has-peer', peer !== null);

  // thread
  const head = document.getElementById('threadHead'), mbox = document.getElementById('msgs');
  const input = document.getElementById('text'), btn = document.getElementById('sendBtn');
  input.disabled = btn.disabled = (peer === null || sending);
  if (peer === null) {
    head.innerHTML = '';
    mbox.innerHTML = '<div class="empty">Chọn một người ở bên trái để bắt đầu nhắn tin.</div>';
    return;
  }
  const pc = contacts.find(x => x.uid === peer);
  head.innerHTML = `<button class="back" onclick="pick(null)" aria-label="Quay lại">‹</button>
    <span class="avatar sm" style="background:${pc ? pc.color : '#888'}">${esc(initials(contactName(peer)))}</span>
    <b>${esc(contactName(peer))}</b>`;
  const thread = messages.filter(m => m.peer === peer);
  const atBottom = mbox.scrollHeight - mbox.scrollTop - mbox.clientHeight < 80;
  if (!thread.length) { mbox.innerHTML = '<div class="empty">Chưa có tin nhắn. Hãy gửi lời chào!</div>'; return; }
  mbox.innerHTML = thread.map(m => {
    let verify = '';
    if (!m.mine) {
      if (AUTOVERIFY || verified.has(m.id)) {
        verify = m.valid
          ? '<div class="verify"><span class="check good">✔ HỢP LỆ — đúng người gửi, chưa bị sửa</span></div>'
          : '<div class="verify"><span class="check bad">⚠ KHÔNG HỢP LỆ — nội dung đã bị thay đổi!</span></div>';
      } else {
        verify = `<div class="verify"><button class="check q" onclick="checkSig(${m.id})">🔍 Kiểm tra chữ ký</button></div>`;
      }
    }
    const status = m.mine ? (m.pending ? ' · ⏳ đang chờ chuyển' : ' · ✓ đã gửi') : '';
    return `<div class="msg ${m.mine ? 'me' : 'them'}">
      <div class="body">${esc(m.text)}</div>
      <div class="meta"><span>${fmtTime(m.ts)}</span><span>r=${esc(m.r)}…</span><span>${status}</span></div>${verify}</div>`;
  }).join('');
  if (atBottom || render.forceBottom) mbox.scrollTop = mbox.scrollHeight;
  render.forceBottom = false;
}

function checkSig(id) {
  verified.add(id);
  sessionStorage.setItem(verKey, JSON.stringify([...verified]));
  render();
}

function pick(uid) {
  peer = uid; render.forceBottom = true; render();
  if (uid !== null && window.innerWidth > 720) setTimeout(() => document.getElementById('text').focus(), 0);
}

async function send() {
  const input = document.getElementById('text'); const text = input.value.trim();
  if (!text || peer === null || sending) return;
  sending = true; render();
  try {
    await api('/api/send', { token: TOKEN, to: peer, text });
    input.value = '';
    render.forceBottom = true;
  } catch (e) {
    if (e.code === 'session expired') return expired();
    toast(e.message, 'bad');
  } finally {
    sending = false;
    await poll(true);
    input.focus();
  }
}

function expired() {
  localStorage.removeItem('sc_token');
  sessionStorage.setItem('sc_notice', 'Phiên đã hết hạn (server vừa khởi động lại hoặc bị xóa dữ liệu). Hãy tham gia lại.');
  location.replace('/');
}
function leave() { localStorage.removeItem('sc_token'); location.replace('/'); }

async function poll(force) {
  if (polling && !force) return;
  polling = true;
  try {
    const snap = await api('/api/state', { token: TOKEN });
    document.getElementById('conn').className = 'conn ok';
    if (!force && snap.event === lastEvent) return;
    lastEvent = snap.event; ME = snap.me; contacts = snap.contacts; messages = snap.messages;

    // notify about NEW incoming messages that are not in the open conversation
    const ids = new Set(messages.map(m => m.id));
    if (known) {
      for (const m of messages) {
        if (!m.mine && !known.has(m.id) && (m.peer !== peer || document.hidden)) {
          toast(`💬 Tin nhắn mới từ ${contactName(m.peer)}`, 'info');
        }
      }
    }
    known = ids;
    if (peer !== null && !contacts.some(c => c.uid === peer)) peer = null;
    if (peer === null && window.innerWidth > 720 && contacts.length === 1) peer = contacts[0].uid;
    if (peer === null && AUTOVERIFY && messages.length) peer = messages[0].peer;
    render();
  } catch (e) {
    if (e.code === 'session expired') return expired();
    document.getElementById('conn').className = 'conn off';
  } finally {
    polling = false;
  }
}

document.getElementById('composeForm').addEventListener('submit', e => { e.preventDefault(); send(); });
document.getElementById('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !isEnter(e)) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(true); });
poll(true);
setInterval(poll, 1500);
</script>
</body>
</html>
